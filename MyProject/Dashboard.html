<!DOCTYPE html>
<html>
<head>
  <title>TaxTrack Dashboard</title>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    #phone {
      width: 320px;
      background: white;
      border-radius: 25px;
      padding: 20px;
      box-shadow: 0 0 10px gray;
    }

    h2 {
      text-align: center;
    }

    .hello {
      color: gray;
    }

    .section-title {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
    }

    .item {
      border-bottom: 1px solid #ccc;
      padding: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .left {
      display: flex;
      align-items: center;
    }

    .left input {
      margin-right: 10px;
    }

    .due {
      font-size: 12px;
      color: gray;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      background: lightblue;
      border: none;
      cursor: pointer;
    }

    .highlight {
      background: #e6f7ff;
    }
  </style>
</head>

<body>

<div id="phone">

  <h2>TaxTrack Dashboard</h2>

  <p class="hello">Hello, Diya 👋</p>

  <div class="section-title">Upcoming Tax Deadlines</div>

  <div class="item">
    <div class="left">
      <input type="checkbox" class="check">
      <div>
        <div>Vehicle Tax</div>
        <div class="due">Due: March 19</div>
      </div>
    </div>
    <div>Car BA</div>
  </div>

  <div class="item">
    <div class="left">
      <input type="checkbox" class="check">
      <div>
        <div>Property Tax</div>
        <div class="due">Due: May 15</div>
      </div>
    </div>
    <div>House</div>
  </div>

  <div class="item">
    <div class="left">
      <input type="checkbox" class="check">
      <div>
        <div>Estate Tax</div>
        <div class="due">Due: June 21</div>
      </div>
    </div>
    <div>Land</div>
  </div>

  <button id="viewCalendar">📅 View Calendar</button>

</div>

<script>
$(document).ready(function(){

  // Highlight when checkbox is clicked
  $(".check").click(function(){
    $(this).closest(".item").toggleClass("highlight");
  });

  // Button click
  $("#viewCalendar").click(function(){
    alert("Opening Calendar...");
  });

});
</script>

</body>
</html>
