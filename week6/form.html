<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Firebase CRUD</title>
</head>
<body>

<h1>Firebase CRUD System</h1>

<!-- CREATE -->
<h2>Create User</h2>
<input type="text" id="userId" placeholder="User ID">
<input type="text" id="name" placeholder="Name">
<input type="text" id="email" placeholder="Email">
<button onclick="createUser()">Create</button>

<!-- READ -->
<h2>Read Users</h2>
<button onclick="readUser()">Read</button>

<!-- UPDATE -->
<h2>Update User</h2>
<input type="text" id="updateId" placeholder="User ID">
<input type="text" id="updateName" placeholder="New Name">
<input type="text" id="updateEmail" placeholder="New Email">
<button onclick="updateUser()">Update</button>

<!-- DELETE -->
<h2>Delete User</h2>
<input type="text" id="deleteId" placeholder="User ID">
<button onclick="deleteUser()">Delete</button>

<script src="script.js"></script>

</body>
</html>
