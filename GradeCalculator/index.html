<!DOCTYPE html>
<html>
<head>
    <title>Student Grade & Average Calculator</title>
</head>

<body>

    <h2>Student Marks Calculator</h2>

    <input type="number" id="Maths" placeholder="Enter Maths Marks"><br><br>
    <input type="number" id="Science" placeholder="Enter Science Marks"><br><br>
    <input type="number" id="English" placeholder="Enter English Marks"><br><br>
    <input type="number" id="Computer" placeholder="Enter Computer Marks"><br><br>
    <input type="number" id="History" placeholder="Enter History Marks"><br><br>

    <button onclick="calculate()">Calculate</button>

    <p id="total"></p>
    <p id="average"></p>
    <p id="grade"></p>

    <script src="script.js"></script>

</body>
</html>
