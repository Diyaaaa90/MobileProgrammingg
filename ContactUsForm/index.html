<!DOCTYPE html>
<html>
<head>
  <title>Contact Customer Support</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .container {
      width: 600px;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    .header {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
      padding: 12px;
      background: #e8f7ef;
      color: #1a7f5a;
      border-radius: 8px;
    }

    .row {
      display: flex;
      gap: 15px;
    }

    .field {
      flex: 1;
      margin-bottom: 15px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      display: block;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #1abc9c;
    }

    .full {
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #1abc9c;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #16a085;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">Contact Us</div>

    <form id="contactForm">

      <div class="row">
        <div class="field">
          <label>First Name</label>
          <input type="text" id="firstName" placeholder="First Name" required>
        </div>

        <div class="field">
          <label>Last Name</label>
          <input type="text" id="lastName" placeholder="Last Name" required>
        </div>
      </div>

      <div class="full">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="Email Address" required>
      </div>

      <div class="full">
        <label>Phone Number</label>
        <input type="text" id="phone" placeholder="Phone Number" required>
      </div>

      <div class="full">
        <label>Reason for Contact</label>
        <select id="reason" required>
          <option value="">Choose your reason</option>
          <option>Technical Issue</option>
          <option>Billing</option>
          <option>General Inquiry</option>
          <option>Feedback</option>
        </select>
      </div>

      <button type="submit">Contact Us</button>

    </form>

  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
