<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tax Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- TOP BAR (VISIBLE ON MOBILE) -->
<div class="topbar">
  <span class="menu-btn" onclick="toggleMenu()">☰</span>
  <h2>Tax Dashboard</h2>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="profile">
    <img src="https://i.pravatar.cc/100" alt="profile">
    <h3>Diya Khatri</h3>
  </div>

  <div class="nav-item"><span class="icon">🏠</span><span class="nav-text">Home</span></div>
  <div class="nav-item"><span class="icon">📅</span><span class="nav-text">Tax Calendar</span></div>
  <div class="nav-item"><span class="icon">📦</span><span class="nav-text">My Assets</span></div>
  <div class="nav-item"><span class="icon">💰</span><span class="nav-text">Tax</span></div>
  <div class="nav-item"><span class="icon">⏰</span><span class="nav-text">Reminders</span></div>
  <div class="nav-item"><span class="icon">📊</span><span class="nav-text">Reports</span></div>
</div>

<!-- MAIN CONTENT -->
<div class="main">
  <div class="card">
    <h3>Tax Calendar</h3>
    <p>March 19, 2026</p>
    <p>Vehicle: Car</p>
    <p>Amount: Rs. 22,000</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
